<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazilio - Offline</title>
<meta name="theme-color" content="#1a1a1a">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #1a1a1a;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    text-align: center;
    padding: 24px;
  }
  .content { max-width: 320px; }
  .icon {
    width: 72px; height: 72px; border-radius: 50%;
    margin: 0 auto 20px;
    background: #c9a227;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    box-shadow: 0 0 0 3px rgba(201,162,39,.3);
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 14px; color: #a39c86; line-height: 1.5; margin-bottom: 20px; }
  .status { font-size: 12px; color: #5a5a5a; }
</style>
</head>
<body>
  <div class="content">
    <div class="icon">📡</div>
    <h1>Sem conexão</h1>
    <p>Os dados salvos no aparelho continuam disponíveis.<br>Conecte-se à internet para sincronizar.</p>
    <div class="status">Bazilio Portas · offline</div>
  </div>
</body>
</html>
