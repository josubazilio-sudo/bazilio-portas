<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline - Bazilio Portas</title>
<link rel="icon" href="/bazilio-portas/icon.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f6f5f1;color:#201f1c;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border:1px solid #e6e2d8;border-radius:16px;padding:40px 24px;max-width:360px;text-align:center;box-shadow:0 4px 24px rgba(20,20,15,.08)}
  .icon{font-size:56px;margin-bottom:16px}
  h1{font-size:22px;font-weight:700;margin-bottom:8px;color:#1a1a1a}
  p{color:#736e63;line-height:1.6;margin-bottom:24px}
  .btn{display:inline-block;background:linear-gradient(180deg,#e4c25f,#c9a227);color:#1a1400;border:none;border-radius:10px;padding:14px 28px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none}
  .btn:hover{filter:brightness(1.05)}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📱</div>
  <h1>Você está offline</h1>
  <p>O Bazilio Portas precisa de conexão para sincronizar dados. Verifique sua internet e tente novamente.</p>
  <button class="btn" onclick="window.location.reload()">Tentar novamente</button>
</div>
</body>
</html>
